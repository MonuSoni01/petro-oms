    <script>
        // Change this value whenever a new version is deployed.
        const PETRO_APP_VERSION = "2026.09.12.1";
        (async function clearOldAppCache() {
            const savedVersion = localStorage.getItem("petro_app_version");
            if (savedVersion === PETRO_APP_VERSION) return;

            localStorage.setItem("petro_app_version", PETRO_APP_VERSION);

            try {
                if ("caches" in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(name => caches.delete(name)));
                }

                if ("serviceWorker" in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(registration => registration.unregister()));
                }
            } catch (error) {
                console.warn("Old cache cleanup failed:", error);
            }

            const url = new URL(window.location.href);
            if (url.searchParams.get("appVersion") !== PETRO_APP_VERSION) {
                url.searchParams.set("appVersion", PETRO_APP_VERSION);
                window.location.replace(url.toString());
            }
        })();
    </script>

    <script>

        function toggleDarkMode() {
            const body = document.body;
            const toggle = document.getElementById("darkToggle");

            if (toggle.checked) {
                body.classList.add("dark");
                localStorage.setItem("petro_dark", true);
            } else {
                body.classList.remove("dark");
                localStorage.setItem("petro_dark", false);
            }
        }

    </script>
